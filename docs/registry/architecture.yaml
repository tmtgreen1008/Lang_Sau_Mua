# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: "superseded_by: ADR-NNNN" instead,
#     quoted: unquoted, the second colon makes the file invalid YAML.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="superseded_by: ADR-"
#
# LAYOUT: the one shape .claude/scripts/registry.sh reads. Each section is a
#   key at column 0 holding a block list, or [] while it is empty. Each entry
#   starts with its section's name key ("- state:", "- contract:", "- system:"
#   or "- target_fps:" for the frame budget, "- purpose:", "- pattern:"), the
#   dash at column 2 (or 0, the same for every entry of a section); its fields
#   sit two columns past the dash. Quote a value that holds ": ", such as
#   "superseded_by: ADR-NNNN". A line in any other shape is reported as
#   unsupported layout, with its number.

version: 1
last_updated: "2026-10-27"

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: game_config
    status: active
    owner_system: game-config
    adr: docs/architecture/adr-0003-json-data-loading-and-validation.md
    interface: "GameConfig typed getters, read-only after load; values come from assets/data/game_config.json; a missing required key is a load error, never a silent default"
    write_access: game-config-only
    referenced_by:
      - docs/architecture/adr-0003-json-data-loading-and-validation.md
    added: 2026-10-27
    revised: ""

  - state: clock_pause_state
    status: active
    owner_system: day-clock
    adr: docs/architecture/adr-0004-clock-and-app-lifecycle.md
    interface: "DayClock.set_paused(source: StringName, paused: bool) and is_paused(); the clock stands while any of the sources panel, app_paused, app_focus, window_focus, player is set"
    write_access: main-composition-root-only
    referenced_by:
      - docs/architecture/adr-0004-clock-and-app-lifecycle.md
    added: 2026-10-27
    revised: ""

  - state: save_file_set
    status: active
    owner_system: save-game
    adr: docs/architecture/adr-0005-save-versioning-and-write-durability.md
    interface: "SaveGame.save(state), load_state(accept) -> LoadResult, backup_loaded_file(version), archive_for_new_game(); the files savegame.json, .tmp, .bak, v<N>.bak and the savegame.corrupt.<n>.* sets"
    write_access: save-game-only
    referenced_by:
      - docs/architecture/adr-0005-save-versioning-and-write-durability.md
    added: 2026-10-27
    revised: ""

# Example:
#
# state_ownership:
#   - state: player_health
#     status: active           # active | "superseded_by: ADR-NNNN"
#     owner_system: health-system
#     adr: docs/architecture/adr-0001-health-system.md
#     interface: "HealthComponent.current_health (read-only float, range 0–max_health)"
#     write_access: health-system-only   # only owner can write; others read
#     referenced_by:
#       - docs/architecture/adr-0001-health-system.md
#       - docs/architecture/adr-0003-combat-system.md   # reads to apply damage
#       - docs/architecture/adr-0007-ui-system.md       # reads to display HUD
#     added: 2026-03-26
#     revised: ""


# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: cross_module_effects
    status: active
    pattern: signal
    producer: domain-modules
    consumers:
      - main-composition-root
    adr: docs/architecture/adr-0002-composition-root-and-event-architecture.md
    signal_signature: "each domain module emits its own past-tense signals; only Main (or a feature composer) connects them and runs the cross-module handler named _on_<module>_<signal>"
    referenced_by:
      - docs/architecture/adr-0002-composition-root-and-event-architecture.md
    added: 2026-10-27
    revised: ""

  - contract: view_refresh_after_load
    status: active
    pattern: direct_call
    producer: main-composition-root
    consumers:
      - views-and-presentation-modules
    adr: docs/architecture/adr-0002-composition-root-and-event-architecture.md
    signal_signature: "sync() -> void re-reads current state with no effects; every view implements it and Main._refresh_all() calls it after a save is loaded"
    referenced_by:
      - docs/architecture/adr-0002-composition-root-and-event-architecture.md
    added: 2026-10-27
    revised: ""

  - contract: data_loading
    status: active
    pattern: direct_call
    producer: data-loader
    consumers:
      - data-modules
    adr: docs/architecture/adr-0003-json-data-loading-and-validation.md
    signal_signature: "DataLoader.read_json(path) -> DataResult is the only JSON reader; each data module exposes configure(data: Dictionary, result: DataResult) -> void, which validates, fills itself and records every error and warning in result"
    referenced_by:
      - docs/architecture/adr-0003-json-data-loading-and-validation.md
    added: 2026-10-27
    revised: ""

  - contract: cross_file_data_validation
    status: active
    pattern: direct_call
    producer: data-validator
    consumers:
      - main-composition-root
    adr: docs/architecture/adr-0003-json-data-loading-and-validation.md
    signal_signature: "DataValidator.validate(crops, clock, book, village, config) -> DataResult is called by Main only when every file passed its own check; when skipped, the startup report says so and names the failing file"
    referenced_by:
      - docs/architecture/adr-0003-json-data-loading-and-validation.md
    added: 2026-10-27
    revised: ""

  - contract: app_lifecycle_to_clock
    status: active
    pattern: direct_call
    producer: main-composition-root
    consumers:
      - day-clock
    adr: docs/architecture/adr-0004-clock-and-app-lifecycle.md
    signal_signature: "Main._notification maps APPLICATION_PAUSED/RESUMED to source app_paused, APPLICATION_FOCUS_OUT/IN to app_focus, WM_WINDOW_FOCUS_OUT/IN to window_focus (RESUMED clears all three); saves on PAUSED, FOCUS_OUT, WM_WINDOW_FOCUS_OUT and WM_CLOSE_REQUEST, skipping the write when the serialized state is unchanged; panel is recomputed from the panels every frame"
    referenced_by:
      - docs/architecture/adr-0004-clock-and-app-lifecycle.md
    added: 2026-10-27
    revised: ""

  - contract: save_load_result
    status: active
    pattern: direct_call
    producer: save-game
    consumers:
      - main-composition-root
    adr: docs/architecture/adr-0005-save-versioning-and-write-durability.md
    signal_signature: "SaveGame.load_state(accept: Callable) -> LoadResult with status OK, NO_SAVE, NEWER_VERSION, UNREADABLE, CORRUPT or RECOVERED; candidates are tried in the order .tmp, main, .bak; NEWER_VERSION and UNREADABLE stop the search; on NEWER_VERSION, UNREADABLE or CORRUPT Main disables autosave and keeps every file"
    referenced_by:
      - docs/architecture/adr-0005-save-versioning-and-write-durability.md
    added: 2026-10-27
    revised: ""

  - contract: save_format_migration
    status: active
    pattern: direct_call
    producer: save-migrations
    consumers:
      - main-composition-root
    adr: docs/architecture/adr-0005-save-versioning-and-write-durability.md
    signal_signature: "SaveMigrations.upgrade(root) runs pure migrate_vN_to_vN+1 functions in order on a copy and sets the new version after each step; a failing step applies nothing; every FORMAT_VERSION has a frozen fixture tests/fixtures/saves/v<N>.json that must upgrade to the current version in CI"
    referenced_by:
      - docs/architecture/adr-0005-save-versioning-and-write-durability.md
    added: 2026-10-27
    revised: ""

