# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: callable_injection
    status: active
    api: "member-function Callable, checked with is_valid() before use, with the meaning of a missing Callable stated per property"
    not: "lambda that reassigns an outer local variable"
    adr: docs/architecture/adr-0002-composition-root-and-event-architecture.md
    reason: "GDScript lambdas capture local variables by value (docs/engine-reference/godot/current-best-practices.md)"
    referenced_by:
      - docs/architecture/adr-0002-composition-root-and-event-architecture.md
    added: 2026-10-27
    revised: ""

  - purpose: json_parsing
    status: active
    api: "JSON.new().parse(text) inside DataLoader, reading get_error_line() and get_error_message() after a failed parse"
    not: "JSON.parse_string() for data files"
    adr: docs/architecture/adr-0003-json-data-loading-and-validation.md
    reason: "JSON.parse_string() returns only a Variant, so the caller gets no line or reason for a parse failure; SaveGame already uses JSON.new().parse() on 4.7.2"
    referenced_by:
      - docs/architecture/adr-0003-json-data-loading-and-validation.md
    added: 2026-10-27
    revised: ""

  - purpose: clock_step_handling
    status: active
    api: "DayClock.tick(delta) clamps the step to max_step_seconds from time_config.json"
    not: "clamping delta in each caller"
    adr: docs/architecture/adr-0004-clock-and-app-lifecycle.md
    reason: "The invariant belongs to the module that owns the data, so every caller and every unit test gets it; the clamp also guarantees at most one phase boundary per tick"
    referenced_by:
      - docs/architecture/adr-0004-clock-and-app-lifecycle.md
    added: 2026-10-27
    revised: ""

  - purpose: day_speed_scaling
    status: active
    api: "DayClock.set_day_speed(mode) with factors from time_config.json"
    not: "Engine.time_scale"
    adr: docs/architecture/adr-0004-clock-and-app-lifecycle.md
    reason: "Engine.time_scale (from memory, unverified) scales the delta of everything else; day speed must change only the day clock"
    referenced_by:
      - docs/architecture/adr-0004-clock-and-app-lifecycle.md
    added: 2026-10-27
    revised: ""

  - purpose: save_write_procedure
    status: active
    api: "write savegame.tmp, read it back and compare with the written text, rotate the main file to savegame.bak, rename the tmp over the main file, restore the .bak on failure"
    not: "writing directly onto the main file, or deleting savegame.bak after a successful save"
    adr: docs/architecture/adr-0005-save-versioning-and-write-durability.md
    reason: "A durable .bak is the only way back when the main file is empty or corrupt after an OS-level power loss, because FileAccess.flush() is not an fsync (from memory, unverified)"
    referenced_by:
      - docs/architecture/adr-0005-save-versioning-and-write-durability.md
    added: 2026-10-27
    revised: ""

