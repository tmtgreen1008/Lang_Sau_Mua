# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: global_event_bus_or_autoload
    status: active
    description: "No autoload singleton and no global event bus for game state or game events. Modules emit their own signals and receive dependencies by injection."
    why: "A global bus hides dependencies, makes modules hard to test in isolation and goes against the project's dependency-injection rule."
    adr: docs/architecture/adr-0002-composition-root-and-event-architecture.md
    added: 2026-10-27

  - pattern: direct_cross_module_connect
    status: active
    description: "A domain module must not connect to another domain module's signals or call it directly, except through a dependency injected by Main (constructor argument or Callable)."
    why: "Cross-module effects live in one place (Main or a feature composer) so interactions can be read and tested in one spot."
    adr: docs/architecture/adr-0002-composition-root-and-event-architecture.md
    added: 2026-10-27

  - pattern: rewire_on_reset
    status: active
    description: "_build() and _wire() run exactly once at startup. A new game or a reload resets the existing modules; it never rebuilds and re-connects them."
    why: "Re-running the wiring on reused objects connects every signal twice."
    adr: docs/architecture/adr-0002-composition-root-and-event-architecture.md
    added: 2026-10-27

  - pattern: silent_startup_failure
    status: active
    description: "Main._ready() must not return silently when data loading or composition fails; it shows an error on a CanvasLayer and keeps _initialised false."
    why: "A silent return leaves the player on a blank screen with no explanation."
    adr: docs/architecture/adr-0002-composition-root-and-event-architecture.md
    added: 2026-10-27

  - pattern: hardcoded_gameplay_values
    status: active
    description: "No gameplay value (speeds, grid size, durations, prices) is hardcoded in src/; values come from the data files and GameConfig. Pixel layout constants are the exception until the display and UI ADRs decide them."
    why: "Hardcoded values cannot be tuned without a code change and break the project's data-driven rule."
    adr: docs/architecture/adr-0003-json-data-loading-and-validation.md
    added: 2026-10-27

  - pattern: silent_data_skip
    status: active
    description: "A data module must not skip an invalid entry and carry on without recording an error in DataResult."
    why: "A skipped entry lets the game start with missing content, for example a request that asks for a crop that does not exist can never be completed."
    adr: docs/architecture/adr-0003-json-data-loading-and-validation.md
    added: 2026-10-27

  - pattern: back_button_direct_quit
    status: active
    description: "The Android Back button (WM_GO_BACK_REQUEST) must not quit the app directly: it closes the top overlay, or opens the Pause panel when none is open."
    why: "An accidental Back press must not end the session; this fits the pillar of a warm, pressure-free game."
    adr: docs/architecture/adr-0004-clock-and-app-lifecycle.md
    added: 2026-10-27

  - pattern: wall_clock_catch_up
    status: active
    description: "Game time must not be advanced by system-clock time or by time spent in the background; there is no offline progress, and DayClock never reads the system clock."
    why: "The confirmed design intent is that nothing is lost while the player is away; it also keeps the clock deterministic and testable."
    adr: docs/architecture/adr-0004-clock-and-app-lifecycle.md
    added: 2026-10-27

  - pattern: destructive_action_on_load
    status: active
    description: "Loading a save must not rename or delete any save file. Renames and deletions happen only after the player explicitly chooses a new game (archive_for_new_game)."
    why: "A load that renames a file turns a transient read error or a save from a newer game into permanent loss."
    adr: docs/architecture/adr-0005-save-versioning-and-write-durability.md
    added: 2026-10-27

  - pattern: overwrite_unreadable_or_newer_save
    status: active
    description: "A save that is unreadable, corrupt with no usable fallback, or written by a newer FORMAT_VERSION must never be overwritten or rotated. Autosave stays off, and SaveGame.save() refuses, until the player chooses a new game."
    why: "Silently starting a new game over an unreadable save destroys the player's progress."
    adr: docs/architecture/adr-0005-save-versioning-and-write-durability.md
    added: 2026-10-27

  - pattern: format_change_without_migration
    status: active
    description: "Changing the shape of a saved section (adding, removing, renaming or retyping a required key or section, or changing the meaning of a value) requires bumping FORMAT_VERSION, a pure migrate function and a new frozen fixture with an upgrade test."
    why: "Without them every existing save becomes unreadable for the next version of the game."
    adr: docs/architecture/adr-0005-save-versioning-and-write-durability.md
    added: 2026-10-27

